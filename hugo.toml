baseURL = 'https://goutham1926.github.io/'
title = "Gautam's Blog"
theme = "DoIt"
defaultContentLanguage = "en"

# Author configuration (used for the footer and metadata)
[params.author]
  name = "Gautam Reddy K"
  email = "goutham64840@gmail.com"
  link = "https://github.com/GOUTHAM1926"

[params]
  # Theme customization
  defaultTheme = "auto" # Auto switches light/dark mode based on system settings
  gitRepo = "https://github.com/GOUTHAM1926/GOUTHAM1926.github.io"
  
  # Search configuration using pagefind (highly optimized)
  [params.search]
    enable = true
    type = "pagefind"
  
  # Header config
  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "Home"
      
  # Profile details on home page
  [params.home]
    [params.home.profile]
      enable = true
      avatarURL = "/images/avatar.jpg" # Using the photo you provided
      title = "Gautam's Blog"
      subtitle = "Hello! Welcome to my blog!"
      social = true
      
  # Social accounts displayed on homepage
  [params.social]
    GitHub = "GOUTHAM1926"
    Linkedin = "goutham1926"
    Email = "goutham64840@gmail.com" # Put your preferred email here

  # Footer configuration (like Yewentao's)
  [params.footer]
    enable = true
    hugo = false           # Hides "Powered by Hugo"
    copyright = true       # Shows copyright symbol
    author = true          # Shows your name
    since = 2026           # Starting year of the blog (shows just 2026)
    license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

# Math rendering config for LaTeX formulas (perfect for AI equations!)
[params.math]
  enable = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Research Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = 2
