baseURL = 'https://goutham1926.github.io/'
title = "Gautam's Blog"
theme = "DoIt"
defaultContentLanguage = "en"

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Author configuration (used for the footer and metadata)
[params.author]
  name = "Gautam Reddy K"
  email = "goutham64840@gmail.com"
  link = "https://github.com/GOUTHAM1926"

[params]
  # Theme customization
  defaultTheme = "auto" # Auto switches light/dark mode based on system settings
  gitRepo = "https://github.com/GOUTHAM1926/GOUTHAM1926.github.io"
  
  # Search configuration using Fuse.js (fast client-side search, same as Yewentao)
  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    placeholder = "Search..."
    maxResultLength = 10
    snippetLength = 40
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      isCaseSensitive = false
      minMatchCharLength = 2
      findAllMatches = false
      location = 0
      threshold = 0.3
      distance = 100
      ignoreLocation = true
      useExtendedSearch = false
      ignoreFieldNorm = false
  
  # Header config
  [params.header]
    themeChangeMode = "switch"
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "Home"
      
  # Profile details on home page
  [params.home]
    [params.home.profile]
      enable = true
      avatarURL = "/images/avatar.jpg" # Using the photo you provided
      title = "Gautam's Blog"
      subtitle = "Hello , Welcome to my blog!"
      typeit = true
      social = true
      
  # Social accounts displayed on homepage
  [params.social]
    GitHub = "GOUTHAM1926"
    Linkedin = "goutham1926"
    Email = "goutham64840@gmail.com" # Put your preferred email here

  # Footer configuration (like Yewentao's)
  [params.footer]
    enable = true
    hugo = false           # Hides "Powered by Hugo"
    copyright = true       # Shows copyright symbol
    author = true          # Shows your name
    since = 2026           # Starting year of the blog (shows just 2026)
    license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

# Math rendering config for LaTeX formulas (perfect for AI equations!)
[params.math]
  enable = true

  # Comment system using Giscus (powered by GitHub Discussions)
  [params.page.comment]
    enable = true
    [params.page.comment.giscus]
      enable = true
      dataRepo = "GOUTHAM1926/GOUTHAM1926.github.io"
      dataRepoId = "R_kgDOTVD68g"
      dataCategory = "Comments"
      dataCategoryId = "DIC_kwDOTVD68s4DBFN_"
      dataMapping = "pathname"
      dataStrict = "0"
      dataReactionsEnabled = "1"
      dataEmitMetadata = "0"
      dataInputPosition = "bottom"
      lightTheme = "light"
      darkTheme = "dark"
      dataLang = "en"
      dataLoading = "lazy"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = 2
